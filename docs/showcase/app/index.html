<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Between Gigs · Prototype</title>
<meta name="description" content="Search, profile and Gigster onboarding: a clickable Between Gigs prototype built from the design system. All people are fictional.">
<script>
  try { var t = localStorage.getItem("bg-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  ::view-transition-old(root) { animation: 320ms cubic-bezier(.4, 0, 1, 1) both bg-out; }
  ::view-transition-new(root) { animation: 640ms cubic-bezier(.2, .8, .2, 1) both bg-in; }
  @keyframes bg-out { to { opacity: 0; transform: scale(.985); } }
  @keyframes bg-in { from { opacity: 0; transform: translateY(24px); } }
  @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<script>
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(BetweenGigs.Templates.GigsApp, { imageBase: "img/", useHash: true }));
</script>
</body>
</html>
